name: CI

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Compact compiler 0.31.1
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: '0.31.1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile contract (with proving keys)
        run: npm run compact

      - name: Check committed artifacts match the source
        run: git diff --exit-code -- contract/src/managed/registry/contract contract/src/managed/registry/zkir

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build web
        run: npm run build --workspace web

      # Playwright is pinned, so the browser build is deterministic and worth caching.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.62.1

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      # The cache restores the browser but not its system libraries.
      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium
        working-directory: web
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      # vite preview serves dist with the production CSP, so these also gate CSP regressions.
      # The live-registry test self-skips: /api/indexer is a Vercel function with no local equivalent.
      - name: Browser tests
        run: npm run e2e --workspace web

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
